<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Movie Details</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 16px;
      background-color: #1f1f1f;
      color: #e50914;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      border: 1px solid #333;
    }
    .poster-img {
      width: 100%;
      max-width: 320px;
      border-radius: 8px;
      display: block;
      margin: 0 auto 20px auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #ffffff;
      text-align: center;
    }
    .details-box {
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      margin: 15px 0;
    }
    .details-item {
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: #cccccc;
    }
    .details-item strong {
      color: #ffffff;
    }
    .section-title {
      font-size: 1.2rem;
      margin-top: 20px;
      margin-bottom: 8px;
      color: #e50914;
      font-weight: bold;
    }
    p {
      color: #dddddd;
      margin-bottom: 15px;
    }
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      margin-top: 10px;
      margin-bottom: 20px;
      background-color: #000;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .download-btn {
      display: block;
      width: 100%;
      text-align: center;
      background-color: #e50914;
      color: #ffffff;
      text-decoration: none;
      padding: 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 15px;
      margin-bottom: 30px;
    }
    .download-btn:active {
      background-color: #b80710;
    }
  </style>
</head>
<body>

  <div class="container" id="movieContent">
    <a href="../index.html" class="back-btn">&larr; Back to Home</a>

    <img id="poster" src="" alt="Movie Poster" class="poster-img">

    <h1 id="title">Loading...</h1>

    <div class="details-box">
      <div class="details-item"><strong>Release Year:</strong> <span id="year"></span></div>
      <div class="details-item"><strong>Genre:</strong> <span id="genre"></span></div>
      <div class="details-item"><strong>IMDb Rating:</strong> <span id="rating"></span> / 10</div>
      <div class="details-item"><strong>Quality:</strong> <span id="quality">1080p x264</span></div>
      <div class="details-item"><strong>Audio:</strong> <span id="audio">Hindi + English (Dual Audio)</span></div>
    </div>

    <div class="section-title">Overview</div>
    <p id="overview"></p>

    <div class="section-title">Cast</div>
    <p id="cast"></p>

    <div class="section-title">Official Trailer</div>
    <div class="video-wrapper">
      <iframe id="trailer" src="" allowfullscreen></iframe>
    </div>

    <div class="section-title">Download / Watch Link</div>
    <a id="downloadLink" href="#" target="_blank" rel="noopener noreferrer" class="download-btn">
      ⬇ Download (1080p)
    </a>
  </div>

  <script src="../data.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');

    if (movieId && movieDatabase[movieId]) {
      const m = movieDatabase[movieId];
      document.getElementById('pageTitle').innerText = m.title + " (" + m.year + ")";
      document.getElementById('poster').src = m.poster;
      document.getElementById('poster').alt = m.title;
      document.getElementById('title').innerText = m.title + " (" + m.year + ")";
      document.getElementById('year').innerText = m.year;
      document.getElementById('genre').innerText = m.genre;
      document.getElementById('rating').innerText = m.rating;
      document.getElementById('overview').innerText = m.overview;
      document.getElementById('cast').innerText = m.cast;
      document.getElementById('trailer').src = "https://www.youtube-nocookie.com/embed/" + m.trailerId;
      document.getElementById('downloadLink').href = m.downloadUrl || "#";
    } else {
      document.getElementById('movieContent').innerHTML = `
        <a href="../index.html" class="back-btn">&larr; Back to Home</a>
        <h2 style="text-align: center; margin-top: 40px;">Movie Not Found</h2>
      `;
    }
  </script>

</body>
</html>
